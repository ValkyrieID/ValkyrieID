# ZAP automation plan: full active scan of the sign-in and account pages (Razor Pages), unauthenticated. ZAP treats
# __RequestVerificationToken as the anti-CSRF token (set on the command line by run.sh), so it fetches a fresh token
# for every attack on a form. pending-login.js adds a pending-login cookie on the two-factor, recovery code, and
# enrollment pages, so their forms are reached too. The email pages (forgot and reset password, email confirmation)
# exist because SMTP is configured in docker-compose.yml. A spider job per page submits its forms (postForm), which
# puts each form POST with a valid token in the site tree for the active scan. See docs/security/zap.md.
env:
  contexts:
    - name: login-pages
      urls:
        - https://valkyrieid.localtest.me:9443/account/login
      includePaths:
        - 'https://valkyrieid\.localtest\.me:9443/account.*'
        - 'https://valkyrieid\.localtest\.me:9443/connect/(authorize|endsession).*'
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: script
    parameters:
      action: add
      type: httpsender
      engine: 'ECMAScript : Graal.js'
      name: pending-login
      file: /zap/wrk/pending-login.js
  - type: requestor
    parameters:
      user: ''
    requests:
      # A real authorization request, so the sign-in form carries a valid ReturnUrl.
      - url: https://valkyrieid.localtest.me:9443/connect/authorize?client_id=valkyrieid-admin-ui&redirect_uri=https%3A%2F%2Fvalkyrieid.localtest.me%3A9443%2Fadmin%2Fcallback&response_type=code&scope=openid&state=zap&nonce=zap&code_challenge=E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM&code_challenge_method=S256
        method: GET
      - url: https://valkyrieid.localtest.me:9443/connect/endsession
        method: GET
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/login?returnUrl=%2Faccount
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/login/2fa?returnUrl=%2Faccount
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/login/recovery?returnUrl=%2Faccount
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/login/enroll?returnUrl=%2Faccount
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/forgot-password
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/reset-password?token=zap
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/confirm-email?token=zap
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/verify-email?token=zap
      maxDuration: 2
      processForm: true
      postForm: true
  - type: spider
    parameters:
      context: login-pages
      url: https://valkyrieid.localtest.me:9443/account/logout
      maxDuration: 2
      processForm: true
      postForm: true
  - type: passiveScan-wait
  - type: activeScan
    parameters:
      context: login-pages
      maxScanDurationInMins: 60
  - type: passiveScan-wait
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/out
      reportFile: login-pages.json
  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/out
      reportFile: login-pages.html
  # The sites tree (methods and parameters), to check which pages and form POSTs were scanned.
  - type: export
    parameters:
      context: login-pages
      type: yaml
      source: sitestree
      fileName: /zap/wrk/out/login-pages-tree.yaml
