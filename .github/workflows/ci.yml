name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Check migrations are up to date
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/ValkyrieID.Data.Sqlite --no-build --configuration Release
          dotnet ef migrations has-pending-model-changes --project src/ValkyrieID.Data.PostgreSql --no-build --configuration Release

      - name: Unit and SQLite integration tests
        run: dotnet test --no-build -c Release -- --filter-not-trait "Category=PostgreSql" --filter-not-trait "Category=Redis"

  admin-ui:
    name: Admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/ValkyrieID.AdminUI
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/ValkyrieID.AdminUI/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: npm ci
      - name: Verify formatting
        run: npm run format:check
      - run: npm run lint
      - name: Unit tests
        run: npm test

      # dotnet publish builds the admin UI and adds it to the output.
      - name: Publish with the admin UI
        working-directory: .
        run: |
          dotnet publish src/ValkyrieID.Server -c Release -o publish
          test -f publish/wwwroot/admin/index.html

  postgres:
    name: PostgreSQL and Redis integration tests
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -c Release

      # Multi-instance tests run two servers against one PostgreSQL database and one Redis (Testcontainers).
      - name: PostgreSQL and Redis integration tests
        run: dotnet test --no-build -c Release --project tests/ValkyrieID.Server.IntegrationTests -- --filter-trait "Category=PostgreSql" --filter-trait "Category=Redis"

  accessibility:
    name: Accessibility (axe, WCAG 2.2 AA)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/ValkyrieID.A11yTests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            tests/ValkyrieID.A11yTests/package-lock.json
            src/ValkyrieID.AdminUI/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: npm ci
      - name: Verify formatting
        run: npm run format:check
      - run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Publishes the server with the admin UI, runs it on SQLite with seeded data, and checks every page with axe.
      - name: Accessibility tests
        run: npm test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: accessibility-report
          path: |
            tests/ValkyrieID.A11yTests/playwright-report
            tests/ValkyrieID.A11yTests/test-results
          retention-days: 7
